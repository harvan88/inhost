<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inhost - Sistema de gestión de flujo de chat en tiempo real">
    <title>Inhost - Chat Flow Test</title>
    <style>
        /* Variables CSS para mejor mantenibilidad */
        :root {
            --color-bg-primary: #0d1117;
            --color-bg-secondary: #161b22;
            --color-bg-tertiary: #21262d;
            --color-border: #30363d;
            --color-text-primary: #c9d1d9;
            --color-text-secondary: #8b949e;
            --color-accent: #58a6ff;
            --color-success: #3fb950;
            --color-warning: #d29922;
            --color-danger: #da3633;
            --color-info: #1f6feb;
            --font-mono: 'SF Mono', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
            --transition-fast: 0.15s;
            --transition-normal: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Mejora de accesibilidad: focus visible */
        *:focus {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        /* Animaciones suaves */
        @media (prefers-reduced-motion: no-preference) {
            * {
                transition: background-color var(--transition-fast),
                           border-color var(--transition-fast),
                           opacity var(--transition-fast);
            }
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Header */
        .header {
            background: var(--color-bg-secondary);
            border-bottom: 1px solid var(--color-bg-tertiary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-accent);
        }

        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 11px;
            opacity: 0.7;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .stat-value {
            font-weight: 600;
            color: var(--color-success);
        }

        /* Main Content - 3 columns */
        .main-content {
            display: flex;
            flex: 1;
            background: var(--color-bg-tertiary);
            overflow: hidden;
            min-height: 0;
        }

        /* Columnas laterales */
        .sidebar {
            width: 250px;
            background: var(--color-bg-secondary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--color-bg-tertiary);
            flex-shrink: 0;
        }

        .sidebar:last-child {
            border-right: none;
            border-left: 1px solid var(--color-bg-tertiary);
        }

        .sidebar-header {
            padding: 12px;
            background: var(--color-bg-primary);
            border-bottom: 1px solid var(--color-bg-tertiary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            flex-shrink: 0;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px;
            /* Mejora de rendimiento: contain */
            contain: layout style paint;
        }

        /* Scrollbar personalizado */
        .sidebar-content::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar,
        .event-log::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track,
        .event-log::-webkit-scrollbar-track {
            background: var(--color-bg-primary);
        }

        .sidebar-content::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb,
        .event-log::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb:hover,
        .chat-messages::-webkit-scrollbar-thumb:hover,
        .event-log::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Cards de clientes/extensiones */
        .card {
            background: var(--color-bg-primary);
            border: 1px solid var(--color-bg-tertiary);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            transition: all var(--transition-normal);
            /* Mejora de rendimiento */
            will-change: transform;
        }

        .card:hover {
            border-color: var(--color-border);
            background: var(--color-bg-secondary);
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 12px;
        }

        .card-icon {
            font-size: 16px;
            /* Prevenir salto de emoji */
            line-height: 1;
        }

        .card-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-status.active {
            background: #238636;
            color: white;
        }

        .card-status.idle {
            background: #6e7681;
            color: white;
        }

        .card-status.disconnected {
            background: var(--color-danger);
            color: white;
        }

        .card-meta {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .card-btn {
            flex: 1;
            padding: 4px 8px;
            font-size: 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--transition-fast);
            /* Mejora de accesibilidad */
            min-height: 24px;
        }

        .card-btn:hover:not(:disabled) {
            background: var(--color-border);
            border-color: var(--color-accent);
        }

        .card-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Chat central */
        .chat-center {
            flex: 1;
            background: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 16px;
            background: var(--color-bg-secondary);
            border-bottom: 1px solid var(--color-bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-title {
            font-weight: 600;
        }

        .chat-actions {
            display: flex;
            gap: 6px;
        }

        .chat-autoscroll-btn {
            padding: 4px 10px;
            font-size: 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-height: 24px;
        }

        .chat-autoscroll-btn:hover {
            background: var(--color-border);
            border-color: var(--color-accent);
        }

        .chat-autoscroll-btn.active {
            background: var(--color-info);
            border-color: var(--color-info);
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            min-height: 0;
            /* Mejora de rendimiento */
            contain: layout style paint;
        }

        /* Mensajes */
        .message {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-bg-tertiary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            transition: transform var(--transition-fast);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.outgoing {
            background: #0a3069;
            border-color: #1158c7;
            margin-left: 20%;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            opacity: 0.7;
        }

        .message-body {
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            /* Seguridad: prevenir XSS */
            overflow-wrap: break-word;
        }

        .message-footer {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            font-size: 10px;
            opacity: 0.5;
        }

        /* Input area */
        .chat-input-area {
            padding: 12px 16px;
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-bg-tertiary);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            background: var(--color-bg-primary);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            color: var(--color-text-primary);
            font-family: var(--font-mono);
            font-size: 12px;
            resize: none;
            min-height: 36px;
        }

        .chat-input:focus {
            border-color: var(--color-accent);
            outline: none;
        }

        .chat-send-btn {
            padding: 8px 16px;
            background: var(--color-info);
            border: 1px solid var(--color-info);
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-width: 80px;
        }

        .chat-send-btn:hover {
            background: #1158c7;
            transform: translateY(-1px);
        }

        .chat-send-btn:active {
            transform: translateY(0);
        }

        /* Event log */
        .event-log {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.4;
            /* Mejora de rendimiento */
            contain: layout style paint;
        }

        .event-line {
            display: flex;
            gap: 8px;
            padding: 2px 4px;
            border-radius: 3px;
            margin-bottom: 2px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .event-line:hover {
            background: rgba(139, 148, 158, 0.1);
        }

        .event-time {
            color: var(--color-text-secondary);
            font-size: 10px;
            white-space: nowrap;
        }

        .event-badge {
            font-weight: 600;
            white-space: nowrap;
        }

        .event-message {
            flex: 1;
            word-break: break-word;
        }

        /* Event types */
        .event-line.info .event-badge {
            color: var(--color-accent);
        }

        .event-line.warning .event-badge {
            color: var(--color-warning);
        }

        .event-line.error .event-badge {
            color: var(--color-danger);
        }

        .event-line.success .event-badge,
        .event-line.sent .event-badge {
            color: var(--color-success);
        }

        .event-line.received .event-badge {
            color: #79c0ff;
        }

        .event-line.processing .event-badge {
            color: #ffa657;
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            opacity: 0.3;
            font-size: 12px;
            text-align: center;
            padding: 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid transparent;
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .sidebar {
                width: 200px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--color-bg-tertiary);
            }

            .sidebar:last-child {
                border-left: none;
                border-top: 1px solid var(--color-bg-tertiary);
            }

            .message.outgoing {
                margin-left: 10%;
            }
        }

        /* Utilidades */
        .text-muted {
            color: var(--color-text-secondary);
        }

        .text-small {
            font-size: 10px;
        }

        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Header -->
        <header class="header" role="banner">
            <h1 class="header-title">🚀 INHOST - Chat Flow Controller</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <span>Clients:</span>
                    <span class="stat-value" id="clientCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Extensions:</span>
                    <span class="stat-value" id="extensionCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Messages:</span>
                    <span class="stat-value" id="messageCount">0</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar izquierdo - Clientes -->
            <aside class="sidebar" role="complementary" aria-label="Clientes conectados">
                <div class="sidebar-header">
                    Clientes
                </div>
                <div class="sidebar-content" id="clientList">
                    <!-- Los clientes se generan dinámicamente -->
                </div>
            </aside>

            <!-- Chat Central -->
            <section class="chat-center" role="main" aria-label="Chat principal">
                <div class="chat-header">
                    <h2 class="chat-title">💬 Chat Stream</h2>
                    <div class="chat-actions">
                        <button 
                            class="chat-autoscroll-btn active" 
                            id="chatAutoscrollBtn" 
                            onclick="toggleChatAutoscroll()"
                            aria-label="Alternar auto-scroll del chat"
                            aria-pressed="true">
                            Auto-scroll ON
                        </button>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages" role="log" aria-label="Mensajes del chat">
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <p>No hay mensajes aún</p>
                        <p class="text-small text-muted">Los mensajes aparecerán aquí</p>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="Escribe un mensaje de prueba..."
                        aria-label="Mensaje de prueba"
                        onkeypress="handleInputKeypress(event)">
                    <button 
                        class="chat-send-btn" 
                        onclick="sendTestMessage()"
                        aria-label="Enviar mensaje">
                        Enviar
                    </button>
                </div>
            </section>

            <!-- Sidebar derecho - Extensiones y logs -->
            <aside class="sidebar" role="complementary" aria-label="Extensiones y registros">
                <div class="sidebar-header">
                    Extensiones
                </div>
                <div class="sidebar-content" id="extensionList">
                    <!-- Las extensiones se generan dinámicamente -->
                </div>

                <div class="sidebar-header">
                    Event Log
                    <button 
                        onclick="clearEventLog()" 
                        style="float: right; font-size: 10px; cursor: pointer; background: none; border: none; color: var(--color-text-secondary);"
                        aria-label="Limpiar log de eventos">
                        Clear
                    </button>
                </div>
                <div class="event-log" id="eventLog" role="log" aria-label="Registro de eventos">
                    <!-- Los eventos se generan dinámicamente -->
                </div>
            </aside>
        </main>
    </div>

    <script>
        'use strict';

        // Configuración
        const CONFIG = {
            WS_URL: 'ws://localhost:8085',
            MAX_LOG_ENTRIES: 100,
            MAX_MESSAGES: 50,
            AUTOSCROLL_THRESHOLD: 50,
            RECONNECT_DELAY: 3000
        };

        // Estado global inmutable
        const state = {
            clients: {
                whatsapp: { connected: false, messages: 0 },
                telegram: { connected: false, messages: 0 },
                sms: { connected: false, messages: 0 }
            },
            extensions: {
                echo: { active: true, latency: 50 },
                ai: { active: false, latency: 150 },
                crm: { active: false, latency: 100 }
            },
            messageCount: 0,
            chatAutoscroll: true,
            ws: null,
            reconnectTimer: null
        };

        // Cache de elementos DOM
        const DOM = {};

        // Inicializar cache de DOM
        function initDOMCache() {
            DOM.clientCount = document.getElementById('clientCount');
            DOM.extensionCount = document.getElementById('extensionCount');
            DOM.messageCount = document.getElementById('messageCount');
            DOM.clientList = document.getElementById('clientList');
            DOM.extensionList = document.getElementById('extensionList');
            DOM.chatMessages = document.getElementById('chatMessages');
            DOM.eventLog = document.getElementById('eventLog');
            DOM.messageInput = document.getElementById('messageInput');
            DOM.chatAutoscrollBtn = document.getElementById('chatAutoscrollBtn');
        }

        // Utilidades
        const utils = {
            // Sanitizar texto para prevenir XSS
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            // Formatear tiempo
            formatTime(date = new Date()) {
                return date.toLocaleTimeString('en-US', { hour12: false }) + 
                       '.' + date.getMilliseconds().toString().padStart(3, '0');
            },

            // Debounce para optimizar eventos
            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },

            // Throttle para limitar llamadas
            throttle(func, limit) {
                let inThrottle;
                return function(...args) {
                    if (!inThrottle) {
                        func.apply(this, args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                };
            }
        };

        // Renderizado de UI
        const UI = {
            renderClients() {
                DOM.clientList.innerHTML = Object.entries(state.clients)
                    .map(([id, client]) => `
                        <div class="card" data-client="${id}">
                            <div class="card-header">
                                <div class="card-title">
                                    <span class="card-icon">${this.getIcon(id)}</span>
                                    <span>${id.charAt(0).toUpperCase() + id.slice(1)}</span>
                                </div>
                                <span class="card-status ${client.connected ? 'active' : 'disconnected'}">
                                    ${client.connected ? 'Online' : 'Offline'}
                                </span>
                            </div>
                            <div class="card-meta">Messages: ${client.messages}</div>
                            <div class="card-actions">
                                <button class="card-btn" onclick="toggleClient('${id}')">
                                    ${client.connected ? 'Desconectar' : 'Conectar'}
                                </button>
                                <button class="card-btn" onclick="simulateClientMessage('${id}')" 
                                        ${!client.connected ? 'disabled' : ''}>
                                    Test
                                </button>
                            </div>
                        </div>
                    `).join('');
            },

            renderExtensions() {
                DOM.extensionList.innerHTML = Object.entries(state.extensions)
                    .map(([id, ext]) => `
                        <div class="card" data-extension="${id}">
                            <div class="card-header">
                                <div class="card-title">
                                    <span class="card-icon">${this.getIcon(id)}</span>
                                    <span>${id.toUpperCase()}</span>
                                </div>
                                <span class="card-status ${ext.active ? 'active' : 'idle'}">
                                    ${ext.active ? 'Active' : 'Idle'}
                                </span>
                            </div>
                            <div class="card-meta">
                                Latency: <span id="latency-${id}">${ext.latency}</span>ms
                            </div>
                            <div class="card-actions">
                                <button class="card-btn" onclick="toggleExtension('${id}')">
                                    ${ext.active ? 'Desactivar' : 'Activar'}
                                </button>
                            </div>
                        </div>
                    `).join('');
            },

            getIcon(type) {
                const icons = {
                    whatsapp: '📱',
                    telegram: '✈️',
                    web: '🌐',
                    sms: '📨',
                    echo: '📢',
                    ai: '🧠',
                    crm: '📊'
                };
                return icons[type] || '💬';
            },

            scrollToBottom() {
                if (state.chatAutoscroll) {
                    requestAnimationFrame(() => {
                        DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
                    });
                }
            }
        };

        // Event Log
        const EventLog = {
            add(type, badge, message) {
                const line = document.createElement('div');
                line.className = `event-line ${type}`;
                line.innerHTML = `
                    <span class="event-time">${utils.formatTime()}</span>
                    <span class="event-badge">[${badge}]</span>
                    <span class="event-message">${utils.escapeHtml(message)}</span>
                `;
                
                DOM.eventLog.appendChild(line);
                
                // Limitar entradas del log
                while (DOM.eventLog.children.length > CONFIG.MAX_LOG_ENTRIES) {
                    DOM.eventLog.removeChild(DOM.eventLog.firstChild);
                }
                
                // Auto-scroll si está cerca del final
                const scrollDiff = DOM.eventLog.scrollHeight - DOM.eventLog.scrollTop - DOM.eventLog.clientHeight;
                if (scrollDiff < CONFIG.AUTOSCROLL_THRESHOLD) {
                    DOM.eventLog.scrollTop = DOM.eventLog.scrollHeight;
                }
            },

            clear() {
                DOM.eventLog.innerHTML = '';
                this.add('info', 'SYSTEM', 'Event log cleared');
            }
        };

        // Chat
        const Chat = {
            addMessage(from, text, isOutgoing = false) {
                // Limpiar placeholder
                if (DOM.chatMessages.querySelector('.empty-state')) {
                    DOM.chatMessages.innerHTML = '';
                }

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isOutgoing ? 'outgoing' : ''}`;
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span>${UI.getIcon(from)} ${from}</span>
                        <span>${new Date().toLocaleTimeString('en-US', { hour12: false })}</span>
                    </div>
                    <div class="message-body">${utils.escapeHtml(text)}</div>
                    <div class="message-footer">
                        <span class="status-icon">✓✓</span>
                        <span>Delivered</span>
                    </div>
                `;

                DOM.chatMessages.appendChild(messageDiv);

                // Limitar mensajes
                while (DOM.chatMessages.children.length > CONFIG.MAX_MESSAGES) {
                    DOM.chatMessages.removeChild(DOM.chatMessages.firstChild);
                }

                UI.scrollToBottom();

                state.messageCount++;
                DOM.messageCount.textContent = state.messageCount;
            },

            sendTestMessage() {
                const text = DOM.messageInput.value.trim();
                if (!text) return;

                this.addMessage('web', text, false);
                EventLog.add('received', 'RECEIVED', `Web → System: "${text}"`);
                
                DOM.messageInput.value = '';
                DOM.messageInput.focus();

                // Procesar con extensiones
                setTimeout(() => Extensions.processMessage(text), 100);
            }
        };

        // Extensions
        const Extensions = {
            processMessage(text) {
                const activeExtensions = Object.entries(state.extensions)
                    .filter(([_, ext]) => ext.active);

                if (activeExtensions.length === 0) {
                    EventLog.add('info', 'INFO', 'No hay extensiones activas');
                    return;
                }

                EventLog.add('processing', 'PROCESSING', 
                    `Routing to ${activeExtensions.length} extension(s)...`);

                activeExtensions.forEach(([extId, ext]) => {
                    setTimeout(() => {
                        EventLog.add('ext-call', 'EXT_CALL', 
                            `→ ${extId} bot (${ext.latency}ms latency)`);

                        // Actualizar latencia
                        const latencyEl = document.getElementById(`latency-${extId}`);
                        if (latencyEl) {
                            latencyEl.textContent = ext.latency;
                        }

                        setTimeout(() => {
                            const response = this.generateResponse(extId, text);
                            Chat.addMessage(extId, response, true);
                            EventLog.add('sent', 'SENT', 
                                `${extId} → Web: "${response}"`);
                        }, ext.latency);
                    }, 50);
                });
            },

            generateResponse(extId, text) {
                const responses = {
                    echo: `Echo: ${text}`,
                    ai: `¡Hola! Recibí tu mensaje: "${text}". ¿En qué puedo ayudarte?`,
                    crm: `[CRM] Contacto registrado. Mensaje: "${text}" guardado.`
                };
                return responses[extId] || text;
            },

            toggle(extId) {
                const ext = state.extensions[extId];
                ext.active = !ext.active;
                
                UI.renderExtensions();
                this.updateCount();
                
                EventLog.add('info', 'EXTENSION', 
                    `${extId} ${ext.active ? 'activado' : 'desactivado'}`);
            },

            updateCount() {
                const count = Object.values(state.extensions)
                    .filter(e => e.active).length;
                DOM.extensionCount.textContent = count;
            }
        };

        // Clients
        const Clients = {
            toggle(clientId) {
                const client = state.clients[clientId];
                client.connected = !client.connected;
                
                UI.renderClients();
                this.updateCount();
                
                EventLog.add(client.connected ? 'info' : 'warning', 'CLIENT', 
                    `${clientId} ${client.connected ? 'conectado' : 'desconectado'}`);
            },

            updateCount() {
                const count = Object.values(state.clients)
                    .filter(c => c.connected).length;
                DOM.clientCount.textContent = count;
            },

            simulateMessage(clientId) {
                const messages = {
                    whatsapp: '¡Hola! Mensaje desde WhatsApp',
                    telegram: 'Mensaje de prueba desde Telegram',
                    sms: 'SMS de prueba'
                };

                const text = messages[clientId] || 'Mensaje de prueba';
                Chat.addMessage(clientId, text, false);
                EventLog.add('received', 'RECEIVED', 
                    `${clientId} → System: "${text}"`);

                state.clients[clientId].messages++;
                UI.renderClients();

                setTimeout(() => Extensions.processMessage(text), 100);
            }
        };

        // WebSocket
        const WebSocket = {
            connect() {
                try {
                    if (state.reconnectTimer) {
                        clearTimeout(state.reconnectTimer);
                        state.reconnectTimer = null;
                    }

                    state.ws = new window.WebSocket(`${CONFIG.WS_URL}/realtime`);

                    state.ws.onopen = () => {
                        EventLog.add('success', 'WEBSOCKET', 'Conectado al servidor');
                    };

                    state.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.handleMessage(data);
                        } catch (e) {
                            EventLog.add('error', 'ERROR', `Parse error: ${e.message}`);
                        }
                    };

                    state.ws.onclose = () => {
                        EventLog.add('warning', 'WEBSOCKET', 'Desconectado del servidor');
                        this.reconnect();
                    };

                    state.ws.onerror = (error) => {
                        EventLog.add('error', 'WEBSOCKET', 'Error de conexión');
                        console.error('WebSocket error:', error);
                    };
                } catch (error) {
                    EventLog.add('error', 'ERROR', `WebSocket error: ${error.message}`);
                    this.reconnect();
                }
            },

            reconnect() {
                if (!state.reconnectTimer) {
                    state.reconnectTimer = setTimeout(() => {
                        EventLog.add('info', 'WEBSOCKET', 'Intentando reconectar...');
                        this.connect();
                    }, CONFIG.RECONNECT_DELAY);
                }
            },

            handleMessage(data) {
                EventLog.add('info', 'WS_MESSAGE', `Received: ${data.type || 'unknown'}`);
                // Procesar mensaje según el tipo
                if (data.type === 'message' && data.content) {
                    Chat.addMessage(data.from || 'system', data.content, false);
                }
            },

            send(data) {
                if (state.ws && state.ws.readyState === window.WebSocket.OPEN) {
                    state.ws.send(JSON.stringify(data));
                } else {
                    EventLog.add('warning', 'WEBSOCKET', 'No conectado al servidor');
                }
            }
        };

        // Funciones globales expuestas
        window.toggleClient = (id) => Clients.toggle(id);
        window.toggleExtension = (id) => Extensions.toggle(id);
        window.simulateClientMessage = (id) => Clients.simulateMessage(id);
        window.sendTestMessage = () => Chat.sendTestMessage();
        window.clearEventLog = () => EventLog.clear();

        window.toggleChatAutoscroll = () => {
            state.chatAutoscroll = !state.chatAutoscroll;
            DOM.chatAutoscrollBtn.classList.toggle('active', state.chatAutoscroll);
            DOM.chatAutoscrollBtn.textContent = state.chatAutoscroll ? 
                'Auto-scroll ON' : 'Auto-scroll OFF';
            DOM.chatAutoscrollBtn.setAttribute('aria-pressed', state.chatAutoscroll);
        };

        window.handleInputKeypress = (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                Chat.sendTestMessage();
            }
        };

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            initDOMCache();
            UI.renderClients();
            UI.renderExtensions();
            Clients.updateCount();
            Extensions.updateCount();
            EventLog.add('info', 'SYSTEM', 'Interface cargada');
            WebSocket.connect();
        });

        // Cleanup al cerrar
        window.addEventListener('beforeunload', () => {
            if (state.ws) {
                state.ws.close();
            }
            if (state.reconnectTimer) {
                clearTimeout(state.reconnectTimer);
            }
        });

        // Manejo de errores global
        window.addEventListener('error', (event) => {
            EventLog.add('error', 'ERROR', `${event.message}`);
            console.error('Global error:', event);
        });

        // Optimización: throttle para scroll
        const throttledScroll = utils.throttle(() => {
            const scrolledToBottom = 
                DOM.chatMessages.scrollHeight - DOM.chatMessages.scrollTop === 
                DOM.chatMessages.clientHeight;
            
            if (scrolledToBottom !== state.chatAutoscroll) {
                state.chatAutoscroll = scrolledToBottom;
                DOM.chatAutoscrollBtn.classList.toggle('active', state.chatAutoscroll);
                DOM.chatAutoscrollBtn.textContent = state.chatAutoscroll ? 
                    'Auto-scroll ON' : 'Auto-scroll OFF';
            }
        }, 200);

        DOM.chatMessages?.addEventListener('scroll', throttledScroll);
    </script>
</body>
</html>
